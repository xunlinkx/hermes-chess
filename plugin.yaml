# Plugin entry point — forwards into src/ layout
#
# This repo uses a src/ layout so pip and pytest work cleanly.
# Hermes plugins expect plugin.yaml and __init__.py at the
# root; these forwarding files bridge the gap.
#
# During install (hermes plugins install), the entire repo is
# cloned. Install via:
#   hermes plugins install xunlinkx/chess
# Or for dev, symlink/copy src/hermes_chess/ directly.
name: hermes-chess
version: 1.1.0
description: "Persistent local human-versus-Stockfish chess with deterministic rules, durable per-messaging-identity state, and interrupted-turn recovery."
author: xunlinkx
kind: standalone
platforms:
  - linux
  - macos
provides_tools:
  - chess_game
hooks:
  - pre_llm_call
optional_env:
  - name: HERMES_CHESS_STOCKFISH
    description: "Absolute path to the local Stockfish executable."
    password: false
  - name: HERMES_CHESS_DB
    description: "Absolute path to the profile-local chess SQLite database."
    password: false
  - name: HERMES_CHESS_DEFAULT_DIFFICULTY
    description: "Default named difficulty used only when the player asks Hermes to choose."
    password: false
  - name: HERMES_CHESS_ENGINE_THREADS
    description: "Bounded Stockfish thread count (default 1)."
    password: false
  - name: HERMES_CHESS_HASH_MB
    description: "Bounded Stockfish hash size in MiB (default 32)."
    password: false
  - name: HERMES_CHESS_ENGINE_TIMEOUT
    description: "Hard engine operation timeout in seconds (default 8)."
    password: false
  - name: HERMES_CHESS_ENGINE_CONCURRENCY
    description: "Maximum concurrent Stockfish calculations (default 1)."
    password: false
  - name: HERMES_CHESS_MAX_ACTIVE_GAMES
    description: "Maximum active or setup games across the profile (default 128)."
    password: false
